name: Diagnose D1 API authentication (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Verify the existing production token with read-only requests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
    steps:
      - name: Probe token validity and D1 access without changing data
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request
          
          TOKEN = os.environ.get("CLOUDFLARE_D1_API_TOKEN", "")
          ACCOUNT = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          DATABASE = os.environ.get("CLOUDFLARE_DATABASE_ID", "")
          
          
          def redact(value):
              text = str(value)
              for secret in (TOKEN, ACCOUNT, DATABASE):
                  if secret:
                      text = text.replace(secret, "[redacted]")
              return re.sub(r"[\x00-\x1f\x7f]", " ", text)[:500]
          
          
          def probe(label, url, payload=None):
              encoded = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  url,
                  data=encoded,
                  headers={
                      "Authorization": "Bearer " + TOKEN,
                      "Content-Type": "application/json",
                  },
                  method="GET" if payload is None else "POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      http_status = response.status
                      raw = response.read(256_000)
              except urllib.error.HTTPError as error:
                  http_status = error.code
                  raw = error.read(256_000)
              except (urllib.error.URLError, TimeoutError) as error:
                  result = {"probe": label, "transport_error": redact(error)}
                  print(json.dumps(result, ensure_ascii=False), flush=True)
                  return False
          
              try:
                  data = json.loads(raw)
              except (ValueError, UnicodeDecodeError):
                  data = {}
              if not isinstance(data, dict):
                  data = {}
          
              errors = data.get("errors") or []
              if not isinstance(errors, list):
                  errors = [errors]
              result = {
                  "probe": label,
                  "http_status": http_status,
                  "success": data.get("success"),
                  "errors": [
                      {
                          "code": error.get("code"),
                          "message": redact(error.get("message", "")),
                      }
                      if isinstance(error, dict)
                      else {"message": redact(error)}
                      for error in errors
                  ],
              }
              value = data.get("result")
              if label == "token_verify" and isinstance(value, dict):
                  result["token_id"] = value.get("id")
                  result["token_status"] = value.get("status")
                  result["expires_on"] = value.get("expires_on")
              elif isinstance(value, list):
                  result["sql_results"] = [
                      {
                          "success": item.get("success"),
                          "error": redact(item.get("error", "")),
                          "rows_read": (item.get("meta") or {}).get("rows_read"),
                          "rows_written": (item.get("meta") or {}).get("rows_written"),
                      }
                      for item in value if isinstance(item, dict)
                  ]
              print(json.dumps(result, ensure_ascii=False), flush=True)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("- " + json.dumps(result, ensure_ascii=False) + "\n")
              return 200 <= http_status < 300 and data.get("success") is True
          
          
          def main():
              print(json.dumps({
                  "token_present": bool(TOKEN),
                  "account_present": bool(ACCOUNT),
                  "database_present": bool(DATABASE),
                  "token_has_outer_whitespace": TOKEN != TOKEN.strip(),
                  "token_has_bearer_prefix": TOKEN.lower().startswith("bearer "),
              }), flush=True)
              if not all((TOKEN, ACCOUNT, DATABASE)):
                  raise SystemExit("Required Cloudflare credentials are missing.")
              base = (
                  "https://api.cloudflare.com/client/v4/accounts/"
                  + ACCOUNT + "/d1/database/" + DATABASE
              )
              checks = [
                  probe(
                      "token_verify",
                      "https://api.cloudflare.com/client/v4/user/tokens/verify",
                  ),
                  probe("d1_query_select_1", base + "/query", {"sql": "SELECT 1 AS probe"}),
                  probe("d1_raw_select_1", base + "/raw", {"sql": "SELECT 1 AS probe"}),
              ]
              if not all(checks):
                  raise SystemExit(1)
          
          
          if __name__ == "__main__":
              main()
          PY
