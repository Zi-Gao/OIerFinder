name: Sync OIer data to Cloudflare

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and compare even when the upstream SHA is unchanged (never bypasses delta safeguards)
        required: false
        default: false
        type: boolean
      upstream_sha:
        description: Optional exact OIerDb commit to deploy
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-oier-data.yml"
      - ".gitmodules"
      - "oierdb-data"
      - "create_db.py"
      - "test_create_db.py"
      - "calculate_stats.py"
      - "pyproject.toml"
      - "uv.lock"
      - "cloudflare/migrations/**"
      - "cloudflare/script/**"
      - "cloudflare/worker/**"

permissions:
  contents: read

concurrency:
  group: oier-data-production
  cancel-in-progress: false

jobs:
  sync:
    name: Verify, archive, and publish incremental data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      PYTHONDONTWRITEBYTECODE: "1"
      D1_SYNC_MAX_OPERATIONS: "1000"
      D1_SYNC_MAX_ESTIMATED_WRITES: "15000"
      D1_SYNC_DAILY_WRITE_BUDGET: "75000"

    steps:
      - name: Configure temporary workspace
        run: |
          workspace="$RUNNER_TEMP/oier-sync"
          mkdir -p "$workspace"
          echo "OIER_SYNC_WORKSPACE=$workspace" >> "$GITHUB_ENV"
          echo "OIER_DATABASE_PATH=$workspace/candidate.db" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Validate synchronization and failure recovery
        run: |
          uv run python -m unittest \
            test_create_db \
            cloudflare.script.test_data_fingerprint \
            cloudflare.script.test_upload_to_d1 \
            cloudflare.script.test_incremental_d1 \
            cloudflare.script.test_sync_snapshot \
            cloudflare.script.test_incremental_sync

      - name: Inspect upstream and active release
        id: inspect
        env:
          FORCE_INPUT: ${{ github.event.inputs.force }}
          REQUESTED_SHA: ${{ github.event.inputs.upstream_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ -n "$REQUESTED_SHA" ]]; then
            if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "upstream_sha must be a full 40-character Git commit SHA" >&2
              exit 2
            fi
            git -C oierdb-data fetch --depth=1 origin "$REQUESTED_SHA"
          else
            git -C oierdb-data fetch --depth=1 origin HEAD
          fi
          upstream_sha="$(git -C oierdb-data rev-parse FETCH_HEAD)"
          git -C oierdb-data checkout --detach "$upstream_sha"
          force_args=()
          if [[ "$FORCE_INPUT" == "true" ]]; then
            force_args+=(--force)
          fi
          uv run python cloudflare/script/incremental_sync.py inspect \
            --workspace "$OIER_SYNC_WORKSPACE" \
            --upstream-sha "$upstream_sha" \
            --event-name "$EVENT_NAME" \
            "${force_args[@]}"

      - name: Generate upstream distribution files
        if: steps.inspect.outputs.should_generate == 'true'
        working-directory: oierdb-data/generator
        run: ../../.venv/bin/python main.py

      - name: Build and validate candidate database
        id: build
        if: steps.inspect.outputs.should_generate == 'true'
        run: |
          source_hash="$(uv run python cloudflare/script/data_fingerprint.py)"
          echo "source_data_hash=$source_hash" >> "$GITHUB_OUTPUT"
          uv run python create_db.py
          uv run python calculate_stats.py \
            --db "$OIER_DATABASE_PATH" \
            --output "$OIER_SYNC_WORKSPACE/candidate-stats.json"

      - name: Set up Node.js
        if: steps.inspect.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json

      - name: Install and test Worker
        if: steps.inspect.outputs.should_run == 'true'
        working-directory: cloudflare/worker
        run: |
          npm ci
          npm test

      - name: Apply D1 migrations
        if: steps.inspect.outputs.needs_schema == 'true' || github.event_name == 'push'
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.toml

      - name: Validate baseline and plan delta
        id: plan
        if: steps.inspect.outputs.should_run == 'true'
        env:
          SOURCE_HASH: ${{ steps.build.outputs.source_data_hash }}
        run: |
          uv run python cloudflare/script/incremental_sync.py prepare \
            --workspace "$OIER_SYNC_WORKSPACE" \
            --database "$OIER_DATABASE_PATH" \
            --stats "$OIER_SYNC_WORKSPACE/candidate-stats.json" \
            --source-data-hash "$SOURCE_HASH" \
            --worker-version "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Build compatible Worker
        if: steps.plan.outputs.should_deploy_worker == 'true'
        working-directory: cloudflare/worker
        run: |
          npm run lint
          npm run build

      - name: Archive immutable candidate on data-state
        id: archive
        if: steps.plan.outputs.requires_publish == 'true'
        run: |
          uv run python cloudflare/script/incremental_sync.py archive \
            --workspace "$OIER_SYNC_WORKSPACE"

      - name: Deploy compatible Worker
        if: steps.plan.outputs.should_deploy_worker == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          command: deploy --keep-vars --var OIERFINDER_SHA:${{ github.sha }}

      - name: Publish delta and snapshot identity atomically
        if: steps.plan.outputs.requires_publish == 'true'
        run: |
          uv run python cloudflare/script/incremental_sync.py publish \
            --workspace "$OIER_SYNC_WORKSPACE"

      - name: Archive synchronization audit
        if: always() && steps.inspect.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: oier-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OIER_SYNC_WORKSPACE }}/inspection.json
            ${{ env.OIER_SYNC_WORKSPACE }}/plan.json
            ${{ env.OIER_SYNC_WORKSPACE }}/publish-result.json
            ${{ env.OIER_SYNC_WORKSPACE }}/bootstrap-archive/manifest.json
            ${{ env.OIER_SYNC_WORKSPACE }}/baseline-archive/manifest.json
            ${{ env.OIER_SYNC_WORKSPACE }}/candidate-archive/manifest.json
          if-no-files-found: warn
          retention-days: 14

      - name: Record synchronization result
        if: always()
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          workspace = Path(os.environ["OIER_SYNC_WORKSPACE"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### OIer incremental synchronization\n\n")
              for name in ("inspection.json", "plan.json", "publish-result.json"):
                  path = workspace / name
                  if not path.exists():
                      continue
                  data = json.loads(path.read_text())
                  keys = ("upstream_sha", "should_generate", "needs_bootstrap", "row_operations",
                          "estimated_writes", "snapshot_commit", "status", "rows_read", "rows_written")
                  for key in keys:
                      if key in data:
                          summary.write(f"- {key}: `{data[key]}`\n")
              summary.write("\nD1 DataRelease is authoritative if a request outcome or final job status is uncertain.\n")
          PY

      - name: Remove temporary databases and archives
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil

          workspace = Path(os.environ["OIER_SYNC_WORKSPACE"]).resolve()
          if workspace.parent != Path(os.environ["RUNNER_TEMP"]).resolve() or workspace.name != "oier-sync":
              raise RuntimeError("Refusing cleanup outside the synchronization workspace")
          shutil.rmtree(workspace, ignore_errors=True)
          PY
