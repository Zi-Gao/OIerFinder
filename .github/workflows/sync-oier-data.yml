name: Sync OIer data to Cloudflare

on:
  schedule:
    - cron: "17 1 * * *" # Daily at 09:17 Asia/Shanghai.
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: Optional full OIerDb commit to publish
        required: false
        default: ""
        type: string
      initialize_luogu:
        description: Create the Luogu D1 table if setting up a new database
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-oier-data.yml"
      - ".gitmodules"
      - "oierdb-data"
      - "create_db.py"
      - "calculate_stats.py"
      - "pyproject.toml"
      - "uv.lock"
      - "cloudflare/script/**"
      - "cloudflare/worker/**"

permissions:
  contents: read

concurrency:
  group: oier-data-production
  cancel-in-progress: false

jobs:
  sync:
    name: Verify and publish static snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Install and test data tools
        run: |
          uv sync --locked
          uv run python -m unittest test_create_db cloudflare.script.test_data_fingerprint cloudflare.script.test_static_snapshot

      - name: Freeze upstream version
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.upstream_sha }}
        run: |
          if [[ -n "$REQUESTED_SHA" ]]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Expected a full upstream Git SHA" >&2; exit 2; }
            git -C oierdb-data fetch --depth=1 origin "$REQUESTED_SHA"
          else
            git -C oierdb-data fetch --depth=1 origin HEAD
          fi
          upstream_sha="$(git -C oierdb-data rev-parse FETCH_HEAD)"
          git -C oierdb-data checkout --detach "$upstream_sha"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "OIER_DATABASE_PATH=$RUNNER_TEMP/oier-candidate.db" >> "$GITHUB_ENV"

      - name: Generate and package verified static data
        env:
          UPSTREAM_SHA: ${{ steps.source.outputs.upstream_sha }}
        run: |
          (cd oierdb-data/generator && ../../.venv/bin/python main.py)
          uv run python create_db.py
          source_hash="$(uv run python cloudflare/script/data_fingerprint.py)"
          uv run python cloudflare/script/build_static_snapshot.py \
            --database "$OIER_DATABASE_PATH" \
            --upstream-sha "$UPSTREAM_SHA" \
            --worker-version "$GITHUB_SHA" \
            --source-data-hash "$source_hash"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json

      - name: Test and build website
        working-directory: cloudflare/worker
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Initialize Luogu D1 table (manual setup only)
        if: github.event_name == 'workflow_dispatch' && inputs.initialize_luogu
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npx wrangler d1 execute DB --remote --config wrangler.toml --file ../migrations/0001_create_luogu_prizes_table.sql

      - name: Publish static data and compatible Worker
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: |
          deploy_log="$RUNNER_TEMP/oier-static-deploy.log"
          for attempt in 1 2 3; do
            if npx wrangler deploy --keep-vars --var "OIERFINDER_SHA:$GITHUB_SHA" --var "ENABLE_QUERY_API:false" > "$deploy_log" 2>&1; then
              cat "$deploy_log"
              exit 0
            else
              deploy_status=$?
            fi
            cat "$deploy_log"
            if [[ "$attempt" -eq 3 ]]; then exit "$deploy_status"; fi
            case "$(< "$deploy_log")" in
              *"[code: 10013]"*|*"HTTP 500"*|*"HTTP 502"*|*"HTTP 503"*|*"HTTP 504"*|*"ECONNRESET"*|*"ETIMEDOUT"*)
                echo "::warning::Temporary Cloudflare deployment error; retrying ($attempt/3)"
                sleep "$((attempt * 5))"
                ;;
              *) exit "$deploy_status" ;;
            esac
          done

      - name: Archive the exact published candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oier-static-${{ github.run_id }}
          path: cloudflare/worker/public/data/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
