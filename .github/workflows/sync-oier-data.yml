name: Sync OIer data to Cloudflare

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even when the upstream SHA is already active
        required: false
        default: false
        type: boolean
      upstream_sha:
        description: Optional exact OIerDb-data-generator commit to deploy
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-oier-data.yml"
      - ".gitmodules"
      - "oierdb-data"
      - "create_db.py"
      - "calculate_stats.py"
      - "pyproject.toml"
      - "uv.lock"
      - "cloudflare/migrations/**"
      - "cloudflare/script/**"
      - "cloudflare/worker/**"

permissions:
  contents: read

concurrency:
  group: oier-data-production
  cancel-in-progress: false

jobs:
  sync:
    name: Build, verify, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_DATABASE_ID: ${{ secrets.CLOUDFLARE_DATABASE_ID }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      D1_BATCH_SIZE: "5000"
      OIER_DATABASE_PATH: ${{ github.workspace }}/oier_data.db
      PRODUCTION_URL: ${{ vars.OIERFINDER_PRODUCTION_URL || 'https://of.zigao.ac' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Detect upstream data change
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
          REQUESTED_SHA: ${{ github.event.inputs.upstream_sha }}
        run: |
          if [[ -n "$REQUESTED_SHA" ]]; then
            if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "upstream_sha must be a full 40-character Git commit SHA" >&2
              exit 2
            fi
            git -C oierdb-data fetch --depth=1 origin "$REQUESTED_SHA"
          else
            git -C oierdb-data fetch --depth=1 origin HEAD
          fi

          upstream_sha="$(git -C oierdb-data rev-parse FETCH_HEAD)"
          git -C oierdb-data checkout --detach "$upstream_sha"
          active_sha="$(uv run python cloudflare/script/upload_to_d1.py --print-active-sha)"

          force=false
          if [[ "$EVENT_NAME" == "push" || "$FORCE_INPUT" == "true" ]]; then
            force=true
          fi

          should_run=false
          if [[ "$force" == "true" || "$upstream_sha" != "$active_sha" ]]; then
            should_run=true
          fi

          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "active_sha=$active_sha" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

          {
            echo "### OIer data change detection"
            echo "- Upstream SHA: \`$upstream_sha\`"
            echo "- Active SHA: \`${active_sha:-none}\`"
            echo "- Forced: \`$force\`"
            echo "- Deployment required: \`$should_run\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate upstream distribution files
        if: steps.detect.outputs.should_run == 'true'
        working-directory: oierdb-data
        run: ../.venv/bin/python main.py

      - name: Build and validate local database
        if: steps.detect.outputs.should_run == 'true'
        run: |
          uv run python create_db.py
          uv run python calculate_stats.py \
            --db oier_data.db \
            --output cloudflare/worker/api/contest_stats.json
          uv run python -m py_compile \
            create_db.py \
            calculate_stats.py \
            cloudflare/script/upload_to_d1.py \
            cloudflare/script/create_indexes.py \
            utils/luogu_crawl.py \
            luogu_crawler.py

      - name: Create release manifest
        if: steps.detect.outputs.should_run == 'true'
        id: manifest
        env:
          UPSTREAM_SHA: ${{ steps.detect.outputs.upstream_sha }}
          WORKER_VERSION: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import sqlite3

          files = ("oier_data.db", "cloudflare/worker/api/contest_stats.json")
          digest = hashlib.sha256()
          file_hashes = {}
          for path in files:
              file_digest = hashlib.sha256()
              with open(path, "rb") as source:
                  while chunk := source.read(1024 * 1024):
                      digest.update(chunk)
                      file_digest.update(chunk)
              file_hashes[path] = file_digest.hexdigest()

          with sqlite3.connect("file:oier_data.db?mode=ro", uri=True) as connection:
              counts = {
                  table: connection.execute(
                      f"SELECT COUNT(*) FROM {table}"
                  ).fetchone()[0]
                  for table in ("OIer", "Contest", "School", "Record")
              }

          data_hash = digest.hexdigest()
          manifest = {
              "upstream_sha": os.environ["UPSTREAM_SHA"],
              "worker_version": os.environ["WORKER_VERSION"],
              "github_run_url": os.environ["RUN_URL"],
              "data_hash": data_hash,
              "file_hashes": file_hashes,
              "row_counts": counts,
          }
          with open("release-manifest.json", "w", encoding="utf-8") as target:
              json.dump(manifest, target, ensure_ascii=False, indent=2)
              target.write("\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"data_hash={data_hash}\n")
          PY

      - name: Set up Node.js
        if: steps.detect.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/worker/package-lock.json

      - name: Install and validate Worker
        if: steps.detect.outputs.should_run == 'true'
        working-directory: cloudflare/worker
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

      - name: Archive generated release
        if: steps.detect.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: oier-data-${{ steps.detect.outputs.upstream_sha }}
          path: |
            oier_data.db
            cloudflare/worker/api/contest_stats.json
            release-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Apply D1 migrations
        if: steps.detect.outputs.should_run == 'true'
        working-directory: cloudflare/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.toml

      - name: Deploy Worker
        if: steps.detect.outputs.should_run == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/worker
          command: deploy

      - name: Smoke test deployed Worker
        if: steps.detect.outputs.should_run == 'true'
        run: |
          response="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 6 \
              --retry-delay 5 \
              --retry-all-errors \
              --max-time 30 \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{"record_filters":[{"contest_id":113},{"contest_id":80,"min_score":0}],"oier_filters":{},"limit":1}' \
              "$PRODUCTION_URL/query-oier"
          )"
          jq -e '.data | type == "array"' <<< "$response"

      - name: Upload and promote D1 data
        if: steps.detect.outputs.should_run == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.detect.outputs.upstream_sha }}
          DATA_HASH: ${{ steps.manifest.outputs.data_hash }}
          WORKER_VERSION: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          uv run python cloudflare/script/upload_to_d1.py \
            --source-sha "$UPSTREAM_SHA" \
            --data-hash "$DATA_HASH" \
            --worker-version "$WORKER_VERSION" \
            --run-url "$RUN_URL"

      - name: Ensure D1 indexes
        if: steps.detect.outputs.should_run == 'true'
        run: uv run python cloudflare/script/create_indexes.py

      - name: Smoke test promoted data
        if: steps.detect.outputs.should_run == 'true'
        run: |
          response="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 3 \
              --retry-delay 3 \
              --retry-all-errors \
              --max-time 30 \
              --request POST \
              --header "Content-Type: application/json" \
              --data '{"record_filters":[{"contest_id":113},{"contest_id":80,"min_score":0}],"oier_filters":{},"limit":1}' \
              "$PRODUCTION_URL/query-oier"
          )"
          jq -e '.data | type == "array"' <<< "$response"

      - name: Activate release
        if: steps.detect.outputs.should_run == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.detect.outputs.upstream_sha }}
        run: |
          uv run python cloudflare/script/upload_to_d1.py \
            --activate-source-sha "$UPSTREAM_SHA"
          {
            echo "### Deployment completed"
            echo "- Active upstream SHA: \`$UPSTREAM_SHA\`"
            echo "- Data hash: \`${{ steps.manifest.outputs.data_hash }}\`"
            echo "- Production URL: $PRODUCTION_URL"
          } >> "$GITHUB_STEP_SUMMARY"
