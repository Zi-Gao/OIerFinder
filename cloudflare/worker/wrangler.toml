name = "oier-finder"
main = "api/index.js"
compatibility_date = "2025-09-20"

[[routes]]
pattern = "of.zigao.ac"
custom_domain = true

[[routes]]
pattern = "oftest.zigao.ac"
custom_domain = true



[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/query-oier",
  "/luogu/*",
  "/version",
  "/docs",
  "/openapi.json",
]

[[d1_databases]]
binding = "DB"
database_name = "oier-data"
database_id = "07124146-94a9-4848-9bd0-e82fc50a5af8"
migrations_dir = "../migrations"
